cradle:
  cabal:
    - path: "./ast/src"
      component: "ast:lib:ast"
    - path: "./ast/tests"
      component: "ast:test:ast-test"
    - path: "./parser/src"
      component: "parser:lib:parser"
    - path: "./parser/tests"
      component: "parser:test:parser-test"
    - path: "./parser/app"
      component: "parser:exe:parser-exe"
    - path: "./compiler/src"
      component: "compiler:lib:compiler"
    - path: "./compiler/tests"
      component: "compiler:test:compiler-test"
    - path: "./vm/src"
      component: "vm:lib:vm"
    - path: "./repl/src"
      component: "repl:lib:repl"
    - path: "./repl/app"
      component: "repl:exe:glados-repl"
    - path: "./cli/src"
      component: "cli:exe:cli"
    - path: "./cabal-extract"
      component: "cabal-extract:exe:cabal-extract"
